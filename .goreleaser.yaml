# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: weeklog

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/weeklog
    binary: weeklog
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

snapshot:
  version_template: "{{ incpatch .Version }}-next"

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
