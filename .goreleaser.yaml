# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: weeklog

builds:
  - main: ./cmd/weeklog
    binary: weeklog
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    # v0.1.0 ships Linux and macOS only. Windows path and plugin-permission
    # code is untested, and CI does not run windows-latest.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]

snapshot:
  version_template: "{{ incpatch .Version }}-next"

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
